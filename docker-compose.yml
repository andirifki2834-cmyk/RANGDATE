version: "3.9"
services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: rngdat
      POSTGRES_PASSWORD: ganti-password-kuat-disini
      POSTGRES_DB: rngdat_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
  app:
    build: .
    restart: always
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://rngdat:ganti-password-kuat-disini@db:5432/rngdat_db
      JWT_SECRET: ganti-minimal-32-karakter-acak-contoh-1234567890abcdef
      ADMIN_INITIAL_PASSWORD: nondo1234
    ports:
      - "3000:3000"

volumes:
  pgdata:
